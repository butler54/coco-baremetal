apiVersion: v1
kind: Secret
metadata:
  name: myrandomuniquename
type: Opaque
data:
  api-key: Y015TWFnaWNLZXlJc0FCYW5hbmEK # secret is cMyMagicKeyIsABanana
---
apiVersion: v1
kind: Pod
metadata:
  name: coco-demo-secret
  labels:
    app: coco-demo-secret
  annotations:
    io.katacontainers.config.hypervisor.default_vcpus: "2"
    io.katacontainers.config.hypervisor.default_memory: "4096"

spec:
  runtimeClassName: kata-cc
  serviceAccountName: coco-demo-secret-sa
  initContainers:
  - name: fetch-secret
    image: registry.access.redhat.com/ubi9/ubi:9.3
    command:
    - /bin/bash
    - -c
    - |
      # Install curl if not available
      # microdnf install -y curl jq
      
      # Get the secret via Kubernetes API
      SECRET_DATA=$(curl -s -H "Authorization: Bearer $(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
        -H "Accept: application/json" \
        "https://kubernetes.default.svc/api/v1/namespaces/$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)/secrets/myrandomuniquename")
      
      # Extract and decode the api-key
      API_KEY=$(echo "$SECRET_DATA" | jq -r '.data."api-key"' | base64 -d)
      
      # Save to a file that the main container can access
      echo "$API_KEY" > /shared/api-key.txt
      
      echo "Secret fetched and saved successfully"
    volumeMounts:
    - name: shared-volume
      mountPath: /shared
  containers:
  - name: coco-demo-secret
    image: registry.access.redhat.com/ubi9/ubi:9.3
    command:
    - sleep
    - "36000"
    securityContext:
      privileged: false
      seccompProfile:
        type: RuntimeDefault
    volumeMounts:
    - name: shared-volume
      mountPath: /keys
      readOnly: true
  volumes:
  - name: shared-volume
    emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: coco-demo-secret-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["myrandomuniquename"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-reader-binding
subjects:
- kind: ServiceAccount
  name: coco-demo-secret-sa
roleRef:
  kind: Role
  name: secret-reader
  apiGroup: rbac.authorization.k8s.io